[package]
name = "jay"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel.workspace = true
hound = "3.5.1"
jay-agent = { version = "0.2.0", path = "../jay-agent" }
